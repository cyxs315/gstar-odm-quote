<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSTAR ODM 报价系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='%230E7C6B'/%3E%3Cpath d='M9 23V11h3.2l3.2 6.6 3.2-6.6H22v12h-3V16.2L16 21.4l-3-5.2V23z' fill='%23FFFFFF'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F4F7F8; --surface:#FFFFFF; --ink:#17222C; --sub:#5A6B7A; --faint:#8A9BA9;
  --line:#E1E8EE; --line-2:#C9D4DD;
  --accent:#0E7C6B; --accent-dark:#0A6255; --accent-soft:#E4F2EF;
  --price:#C2410C; --price-soft:#FBEADF;
  --warn:#A16207; --warn-soft:#FDF3D7;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(23,34,44,.05),0 6px 18px rgba(23,34,44,.06);
  --shadow-lg:0 8px 30px rgba(23,34,44,.12);
  --font:"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.55;font-size:15px}
button,input,select{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
img{max-width:100%;display:block}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none}

/* ===== 顶栏 ===== */
.app-header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.header-inner{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:.2px}
.brand svg{flex:none}
.brand .sub{display:block;font-size:11px;font-weight:500;color:var(--sub);letter-spacing:.5px}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.seg button{padding:4px 12px;border-radius:999px;font-size:13px;color:var(--sub);transition:background .15s,color .15s}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(23,34,44,.12)}
.icon-btn{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--sub);border:1px solid var(--line);background:var(--surface);transition:border-color .15s,color .15s}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}

/* ===== 布局 ===== */
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 64px}
.section-title{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.section-title .tag{font-size:11px;font-weight:500;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px}

/* ===== 首页：品类选择 ===== */
.home-hero{padding:34px 0 8px;text-align:center}
.home-hero h1{font-size:26px;font-weight:800;letter-spacing:.3px}
.home-hero p{margin-top:8px;color:var(--sub);font-size:14px}
.cat-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:26px}
@media (min-width:720px){.cat-grid{grid-template-columns:repeat(2,1fr)}}
.cat-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s,box-shadow .15s;position:relative;overflow:hidden}
.cat-card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow-lg)}
.cat-card .ico{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.cat-card h2{font-size:18px;font-weight:700}
.cat-card .desc{font-size:13px;color:var(--sub);min-height:38px}
.cat-card .meta{font-size:12px;color:var(--faint);border-top:1px dashed var(--line);padding-top:9px;margin-top:2px}
.cat-card .go{margin-top:auto;display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:14px}

/* ===== 报价页布局 ===== */
.quote-head{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.quote-head .back{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--sub)}
.quote-head h1{font-size:19px;font-weight:800;flex:1;min-width:0}
.quote-head .pill{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px;font-weight:600;white-space:nowrap}
.layout{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
@media (min-width:920px){.layout{grid-template-columns:1fr 380px}}

/* ===== 配置器 ===== */
.config{display:flex;flex-direction:column;gap:12px}
.opt-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 15px;box-shadow:var(--shadow)}
.opt-label{font-size:13px;font-weight:700;margin-bottom:9px;display:flex;align-items:baseline;gap:8px}
.opt-label .note{font-weight:400;color:var(--faint);font-size:12px;margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chips .sub{display:inline-block;margin:2px 6px 2px 0;font-size:12px;font-weight:600;color:var(--sub)}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink);transition:all .13s;line-height:1.3}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}
.chip .delta{display:inline-block;margin-left:5px;font-size:12px;color:var(--price);font-variant-numeric:tabular-nums}
.chip.on .delta{color:#FDEBD8}
.chip.dim{opacity:.42;pointer-events:none}
.qty-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qty-input{width:130px;padding:9px 12px;border:1px solid var(--line-2);border-radius:9px;font-size:16px;font-variant-numeric:tabular-nums;background:var(--surface)}
.qty-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,124,107,.14)}
.qty-hint{font-size:12px;color:var(--sub)}

/* ===== 报价结果 ===== */
.result-col{display:flex;flex-direction:column;gap:14px;position:sticky;top:64px}
.result-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden}
.result-head{background:linear-gradient(135deg,var(--accent-dark),var(--accent));color:#fff;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.result-head .t{font-weight:700;font-size:14px}
.result-head .t small{display:block;font-weight:400;opacity:.85;font-size:11px}
.result-body{padding:15px 16px}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;font-size:13px;color:var(--sub);gap:12px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:none}
.row .k{min-width:0}
.row .v{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);white-space:nowrap}
.row.total{font-size:15px;color:var(--ink);padding:10px 0 8px;border-bottom:2px solid var(--ink);border-top:2px solid var(--ink);margin-top:4px}
.row.total .k{font-weight:700}
.row.total .v{font-size:22px;font-weight:800;color:var(--price)}
.row .hint{font-size:11px;color:var(--faint);display:block;font-weight:400}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 16px 15px}
.btn{border-radius:10px;padding:11px 10px;font-size:14px;font-weight:700;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:filter .12s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line-2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-warn{background:var(--price);color:#fff}
.btn-warn:hover{filter:brightness(1.07)}
.btn-block{grid-column:1/-1}

/* ===== 报价文本 ===== */
.quote-text-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.quote-text{white-space:pre-wrap;font-size:13px;line-height:1.7;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:12px;max-height:340px;overflow:auto;font-variant-numeric:tabular-nums}
.copy-hint{font-size:11px;color:var(--faint);margin-top:7px}

/* ===== 价目参考 ===== */
.ref-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 14px;overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
th,td{padding:8px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--sub);white-space:nowrap}
td{color:var(--ink)}
td.r,th.r{text-align:right}
tbody tr:hover{background:#FAFCFC}
.tbl-note{font-size:12px;color:var(--sub);margin-top:10px;background:var(--bg);border-radius:8px;padding:9px 11px}
.tbl-note b{color:var(--price)}

/* ===== 商务条款 ===== */
.terms{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.terms summary{cursor:pointer;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;list-style:none}
.terms summary::-webkit-details-marker{display:none}
.terms summary .caret{transition:transform .15s;color:var(--faint);font-size:12px}
.terms[open] summary .caret{transform:rotate(90deg)}
.terms ul{margin:12px 0 0 2px;list-style:none;display:flex;flex-direction:column;gap:8px}
.terms li{font-size:13px;color:var(--sub);padding-left:14px;position:relative}
.terms li:before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.terms li b{color:var(--ink)}

/* ===== 维护面板 ===== */
.scrim{position:fixed;inset:0;background:rgba(23,34,44,.45);z-index:50;opacity:0;pointer-events:none;visibility:hidden;transition:opacity .18s}
.scrim.show{opacity:1;pointer-events:auto;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-radius:18px 18px 0 0;max-height:88vh;display:flex;flex-direction:column;transform:translateY(102%);visibility:hidden;transition:transform .22s cubic-bezier(.32,.72,0,1),visibility 0s .22s}
.sheet.show{transform:translateY(0);visibility:visible;transition:transform .22s cubic-bezier(.32,.72,0,1)}
.sheet-head{padding:14px 18px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:16px;font-weight:800}
.sheet-body{overflow-y:auto;padding:14px 18px 22px}
.sheet-body h3{font-size:13px;font-weight:700;margin:14px 0 8px;color:var(--sub)}
.sheet-body h3:first-child{margin-top:0}
.param-grid{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:640px){.param-grid{grid-template-columns:repeat(2,1fr)}}
.param{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.param .p-label{flex:1;font-size:12.5px;color:var(--ink);min-width:0}
.param .p-label small{display:block;color:var(--faint);font-size:11px}
.param input{width:92px;padding:6px 8px;border:1px solid var(--line-2);border-radius:7px;font-size:14px;text-align:right;font-variant-numeric:tabular-nums;background:var(--surface)}
.param input:focus{outline:none;border-color:var(--accent)}
.sheet-foot{padding:10px 18px 18px;display:flex;gap:9px;border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1}

/* ===== toast ===== */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;z-index:80;opacity:0;transition:all .2s;pointer-events:none;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 打印 ===== */
@media print{
  body{background:#fff}
  .app-header,.home-hero,.quote-head .back,.actions,.config,.ref-card,.terms,.sheet,.scrim,.toast{display:none!important}
  .wrap{padding:0}
  .layout{display:block}
  .result-col{position:static}
  .result-card{box-shadow:none;border:1px solid #333}
  .row.total .v{color:#000}
  .quote-text{max-height:none;border:1px solid #999}
}
</style>
</head>
<body>

<!-- ===== 顶栏 ===== -->
<header class="app-header">
  <div class="header-inner">
    <div class="brand" id="brandHome" role="button" tabindex="0">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="6" fill="#0E7C6B"/><path d="M9 23V11h3.2l3.2 6.6 3.2-6.6H22v12h-3V16.2L16 21.4l-3-5.2V23z" fill="#fff"/></svg>
      <span>GSTAR ODM 报价系统<span class="sub" data-cn="评级卡卡套 · 钱包 · 出厂含税价" data-en="Card Slabs · Wallets · Factory Price">评级卡卡套 · 钱包 · 出厂含税价</span></span>
    </div>
    <div class="header-actions">
      <div class="seg" id="langSeg">
        <button type="button" data-lang="cn" class="on">中</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <div class="seg" id="curSeg">
        <button type="button" data-cur="cny" class="on">¥</button>
        <button type="button" data-cur="usd">$</button>
      </div>
      <button type="button" class="icon-btn" id="btnAdmin" title="参数维护" aria-label="参数维护">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- ===== 首页 ===== -->
  <section id="view-home" class="view">
    <div class="home-hero">
      <h1 data-cn="ODM 快速报价系统" data-en="ODM Quick Quotation System">ODM 快速报价系统</h1>
      <p data-cn="选择品类，配置规格，即时生成含税出厂报价。价格参数可在后台维护，中英双语、CNY / USD 切换。" data-en="Pick a category, configure specs, get an instant factory price. Editable price base, bilingual, CNY / USD.">选择品类，配置规格，即时生成含税出厂报价。价格参数可在后台维护，中英双语、CNY / USD 切换。</p>
    </div>
    <div class="cat-grid">
      <button type="button" class="cat-card" data-cat="cardslab">
        <span class="ico">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M5 7.5h14M9 2.5v5M15 2.5v5"/><path d="M9.5 12h5M9.5 15.5h5" stroke-opacity=".55"/></svg>
        </span>
        <h2 data-cn="评级卡卡套" data-en="Trading Card Slabs">评级卡卡套</h2>
        <span class="desc" data-cn="PSA / CGC / BGS 评级砖保护壳：塑胶款（PC / TPU+PC / 硅胶+PC）与铝合金磁吸 / 卡扣款，防 UV、抗散边、超声波封合。" data-en="PSA / CGC / BGS graded card slabs: plastic (PC / TPU+PC / Silicone+PC) and aluminum magnetic / snap cases.">PSA / CGC / BGS 评级砖保护壳：塑胶款（PC / TPU+PC / 硅胶+PC）与铝合金磁吸 / 卡扣款，防 UV、抗散边、超声波封合。</span>
        <span class="meta" data-cn="公模 MOQ 500pcs · 阶梯价 ≥2000 下浮 8% · ≥5000 下浮 15%" data-en="Stock MOQ 500pcs · Tier -8% @2000 · -15% @5000">公模 MOQ 500pcs · 阶梯价 ≥2000 下浮 8% · ≥5000 下浮 15%</span>
        <span class="go" data-cn="开始配置 →" data-en="Configure →">开始配置 →</span>
      </button>
      <button type="button" class="cat-card" data-cat="wallet">
        <span class="ico">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="M3.5 10h17"/><rect x="15" y="13" width="4" height="2.4" rx="1"/></svg>
        </span>
        <h2 data-cn="钱包 ODM" data-en="Wallet ODM">钱包 ODM</h2>
        <span class="desc" data-cn="商务 / 户外 / 证件夹 / 定制特殊款。二折三折一折、扩容带、金属外壳；皮革·金属·碳纤维·木纹 19 种材质；表面处理、配件（追踪器/拉链/挂绳）、RFID 单卡位 / 全袋、尺寸颜色可选。" data-en="Biz / outdoor / card case / custom. Folds & metal shell; 19 materials (leather/metal/carbon/wood); surface finish, accessories (tracker/zipper/strap), RFID single/full, size & color.">商务 / 户外 / 证件夹 / 定制特殊款。二折三折一折、扩容带、金属外壳；皮革·金属·碳纤维·木纹 19 种材质；表面处理、配件（追踪器/拉链/挂绳）、RFID 单卡位 / 全袋、尺寸颜色可选。</span>
        <span class="meta" data-cn="公模 MOQ 500pcs · 私模一般 3000pcs 起" data-en="Stock MOQ 500pcs · Custom mold 3000pcs+">公模 MOQ 500pcs · 私模一般 3000pcs 起</span>
        <span class="go" data-cn="开始配置 →" data-en="Configure →">开始配置 →</span>
      </button>
    </div>
  </section>

  <!-- ===== 报价页 ===== -->
  <section id="view-quote" class="view" hidden>
    <div class="quote-head">
      <button type="button" class="back" id="btnBack" aria-label="返回">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 id="quoteTitle">评级卡卡套</h1>
      <span class="pill" data-cn="含税出厂 · 默认 EXW 东莞" data-en="Tax incl. · EXW Dongguan">含税出厂 · 默认 EXW 东莞</span>
    </div>

    <div class="layout">
      <div class="config" id="configBox"><!-- 配置器由 JS 渲染 --></div>

      <div class="result-col">
        <div class="result-card">
          <div class="result-head">
            <span class="t" data-cn="报价结果" data-en="Quote Result">报价结果<span data-cn="实时计算 · 修改即更新" data-en="Live · updates on change">实时计算 · 修改即更新</span></span>
            <span class="t num" id="resQty">0 pcs</span>
          </div>

    var saved = JSON.parse(raw);
    return mergeDeep(JSON.parse(JSON.stringify(DEFAULTS)), saved);
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULTS)); }
}
function mergeDeep(base, over){
  if(!over || typeof over !== 'object') return base;
  Object.keys(over).forEach(function(k){
    if(over[k] && typeof over[k]==='object' && !Array.isArray(over[k])){
      base[k] = mergeDeep(base[k]||{}, over[k]);
    }else{ base[k] = over[k]; }
  });
  return base;
}

/* ================= 工具 ================= */
function byId(list,id){ for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; } return list[0]; }
function r2(n){ return Math.round(n*100)/100; }
function fmt(n){ return n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function curSym(){ return S.cur==='usd' ? '$' : '¥'; }
function cnv(n){ return S.cur==='usd' ? n/S.params.rate : n; }
function px(n){ return curSym()+fmt(cnv(n)); }
function pxs(n){ // 加价显示：+¥0.60
  var v = cnv(n);
  var s = S.cur==='usd' ? '$' : '¥';
  return (v>=0?'+':'') + s + fmt(Math.abs(v));
}
function L(o){ return S.lang==='en' ? (o.en||o.cn) : (o.cn||o.en); }
function tierFor(list,qty){
  var t = list[0];
  for(var i=0;i<list.length;i++){ if(qty>=list[i].min) t=list[i]; }
  return t;
}

/* ================= 计算引擎 ================= */
function calc(){
  var cat=S.cat, p=S.params[cat], sel=S.sel[cat];
  var type=byId(p.types,sel.type), addons=[], addonSum=0;
  function push(o){ if(o.val!==0){ addons.push(o); addonSum+=o.val; } }
  if(cat==='cardslab'){
    push(byId(p.pt,sel.pt));
    push(byId(p.clarity,sel.clarity));
    push(byId(p.finish[type.group],sel.finish));
    if(type.group==='alu') push(byId(p.glass,sel.glass));
    push(byId(p.feature,sel.feature));
    push(byId(p.logo,sel.logo));
    push(byId(p.pack,sel.pack));
  }else{
    var mat = byId(p.material,sel.material);
    push(byId(p.style,sel.style));
    push(byId(p.closure,sel.closure));
    push(byId(p.material,sel.material));
    if(mat.group==='metal') push(byId(p.metalFinish,sel.metalFinish));
    push(byId(p.craft,sel.craft));
    if(mat.group==='leather'){
      push(byId(p.leatherCraft.stitch,sel.lcStitch));
      push(byId(p.leatherCraft.edge,sel.lcEdge));
      push(byId(p.leatherCraft.lining,sel.lcLining));
    }
    sel.func.forEach(function(id){ push(byId(p.func,id)); });
    sel.accessories.forEach(function(id){ push(byId(p.accessories,id)); });
    push(byId(p.logo,sel.logo));
    push(byId(p.pack,sel.pack));
  }
  var tier=tierFor(p.tier,S.qty);
  var unit=r2((type.base+addonSum)*tier.factor);
  var goods=r2(unit*S.qty);
  var mold=byId(p.mold,sel.mold).val;
  var devFee = cat==='wallet' ? byId(p.devFee,sel.devFee).val : 0;
  var total=r2(goods+mold+devFee);
  var isCustom = sel.mold!=='stock' || devFee>0;
  var lead = cat==='cardslab'
    ? (sel.mold==='stock' ? (S.lang==='en'?'7–10 days (stock)':'公模现货改色 / 印 LOGO：7–10 天') : (sel.mold==='plastic' ? (S.lang==='en'?'22–28 days (plastic mold)':'ODM 新开塑胶模：22–28 天（含试模样板）') : (S.lang==='en'?'30–40 days (alu mold)':'ODM 新开铝合金压铸 / CNC 模具：30–40 天')))
    : (isCustom ? (S.lang==='en'?'25–35 days (ODM)':'ODM 定制：25–35 天') : (S.lang==='en'?'10–15 days (stock)':'常规款：10–15 天'));
  var moq = (sel.mold==='stock' && !isCustom) ? 500 : 3000;
  return {type:type,addons:addons,addonSum:addonSum,tier:tier,unit:unit,goods:goods,mold:mold,devFee:devFee,total:total,lead:lead,moq:moq,isCustom:isCustom};
}

function applyLang(){
  var en = S.lang==='en';
  document.documentElement.lang = en?'en':'zh-CN';
  document.querySelectorAll('[data-cn]').forEach(function(el){
    el.textContent = en ? (el.getAttribute('data-en')||el.getAttribute('data-cn')) : el.getAttribute('data-cn');
  });
  document.querySelectorAll('#langSeg button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-lang')===S.lang); });
  document.querySelectorAll('#curSeg button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-cur')===S.cur); });
  renderAll();
}

/* ================= 维护面板 ================= */
function setPath(obj,path,val){
  var parts=path.split('.'), o=obj;
  for(var i=0;i<parts.length-1;i++){ o=o[parts[i]]; }
  o[parts[parts.length-1]] = val;
}
function getPath(obj,path){
  var parts=path.split('.'), o=obj;
  for(var i=0;i<parts.length;i++){ o=o[parts[i]]; }
  return o;
}
function flatParams(p){
  var list=[];
  list.push({path:'rate', cn:'汇率 USD / CNY', en:'Exchange USD / CNY', val:p.rate, step:0.01, group:'sys'});
  ['cardslab','wallet'].forEach(function(cat){
    var d=p[cat];
    var gName = cat==='cardslab' ? {cn:'卡套',en:'Card Slab'} : {cn:'钱包',en:'Wallet'};
    d.types.forEach(function(t){ list.push({path:cat+'.types.'+t.id+'.base', label:t, val:t.base, step:0.1, group:cat+'_base'}); });
    ['pt','clarity','feature','logo','pack','style','closure','material','metalFinish','craft','func','accessories','devFee'].forEach(function(sec){
      if(d[sec]) d[sec].forEach(function(o){ list.push({path:cat+'.'+sec+'.'+o.id+'.val', label:o, val:o.val, step:o.val>=1000?100:(o.val>=100?10:0.05), group:cat+'_add'}); });
    });
    if(d.leatherCraft){ ['stitch','edge','lining'].forEach(function(g){ d.leatherCraft[g].forEach(function(o){ list.push({path:cat+'.leatherCraft.'+g+'.'+o.id+'.val', label:o, val:o.val, step:0.05, group:cat+'_add'}); }); }); }
    if(d.finish){ ['plastic','alu'].forEach(function(g){ d.finish[g].forEach(function(o){ list.push({path:cat+'.finish.'+g+'.'+o.id+'.val', label:o, val:o.val, step:0.05, group:cat+'_add'}); }); }); }
    if(d.glass){ d.glass.forEach(function(o){ list.push({path:cat+'.glass.'+o.id+'.val', label:o, val:o.val, step:0.05, group:cat+'_add'}); }); }
    if(d.mold){ d.mold.forEach(function(o){ list.push({path:cat+'.mold.'+o.id+'.val', label:o, val:o.val, step:o.val>=1000?500:(o.val>=100?50:10), group:cat+'_mold'}); }); }
    if(d.tier){ d.tier.forEach(function(t2,i){ list.push({path:cat+'.tier.'+i+'.factor', cn:'阶梯 · '+t2.label_cn, en:'Tier · '+t2.label_en, val:t2.factor, step:0.01, group:cat+'_tier'}); }); }
  });
  return list;
}

];
function renderSheet(){
  var en = S.lang==='en', list = flatParams(S.params), html='';
  SHEET_GROUPS.forEach(function(g){
    var items = list.filter(function(it){ return it.group===g.id; });
    if(!items.length) return;
    html += '<h3>'+ (en?g.en:g.cn) +'</h3><div class="param-grid">';
    items.forEach(function(it){
      var label = it.label ? (en? (it.label.en||it.label.cn) : it.label.cn) : (en?it.en:it.cn);
      html += '<div class="param"><span class="p-label">'+label+'<small>'+it.path+'</small></span><input type="number" step="'+it.step+'" data-param="'+it.path+'" value="'+it.val+'"></div>';
    });
    html += '</div>';
  });
  document.getElementById('sheetBody').innerHTML = html;
}
function openSheet(){ document.getElementById('sheet').classList.add('show'); document.getElementById('scrim').classList.add('show'); document.body.style.overflow='hidden'; renderSheet(); }
function closeSheet(){ document.getElementById('sheet').classList.remove('show'); document.getElementById('scrim').classList.remove('show'); document.body.style.overflow=''; }
function saveParams(){
  document.querySelectorAll('[data-param]').forEach(function(inp){
    var v = parseFloat(inp.value);
    if(isNaN(v)) return;
    setPath(S.params, inp.getAttribute('data-param'), v);
  });
  localStorage.setItem(LS_KEY, JSON.stringify(S.params));
  closeSheet(); renderAll(); showToast(S.lang==='en'?'Saved. Prices updated.':'已保存，价格已更新。');
}
function restoreParams(){
  localStorage.removeItem(LS_KEY);
  S.params = JSON.parse(JSON.stringify(DEFAULTS));
  closeSheet(); renderAll(); showToast(S.lang==='en'?'Default prices restored.':'已恢复默认价。');
}

/* ================= 视图 ================= */
function showView(v){
  document.getElementById('view-home').hidden = v!=='home';
  document.getElementById('view-quote').hidden = v!=='quote';
  if(v==='quote'){ renderAll(); }
  window.scrollTo(0,0);
}

/* ================= 事件 ================= */
var toastTimer=null;
function showToast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.classList.remove('show'); }, 1800);
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ showToast(S.lang==='en'?'Copied!':'已复制！'); }, function(){ legacyCopy(text); });
  }else{ legacyCopy(text); }
}
function legacyCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); showToast(S.lang==='en'?'Copied!':'已复制！'); }catch(e){ showToast(S.lang==='en'?'Copy failed':'复制失败'); }
  document.body.removeChild(ta);
}

document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('[data-cat]') : null;
  if(t){ S.cat=t.getAttribute('data-cat'); showView('quote'); return; }
  if(e.target.closest && (t=e.target.closest('#langSeg button'))){ S.lang=t.getAttribute('data-lang'); applyLang(); return; }
  if(e.target.closest && (t=e.target.closest('#curSeg button'))){ S.cur=t.getAttribute('data-cur'); applyLang(); return; }
  if(e.target.closest && (t=e.target.closest('#brandHome'))){ showView('home'); return; }
  if(e.target.closest && (t=e.target.closest('#btnBack'))){ showView('home'); return; }
  if(e.target.closest && (t=e.target.closest('#btnCopy'))){ copyText(document.getElementById('quoteText').textContent); return; }
  if(e.target.closest && (t=e.target.closest('#btnPrint'))){ window.print(); return; }
  if(e.target.closest && (t=e.target.closest('#btnReset'))){
    S.sel.cardslab={type:'pc',pt:'35',clarity:'std',finish:'polish',glass:'w20',feature:'none',logo:'none',pack:'opp',mold:'stock'};
    S.sel.wallet={type:'biz', style:'fold2', closure:'elastic', material:'std', metalFinish:'anod', craft:'stitch', lcStitch:'normal', lcEdge:'normal_edge', lcLining:'nonwoven', func:[], accessories:[], logo:'none', pack:'opp', mold:'stock', devFee:'none'};
    S.qty=500; S.size=''; S.color=''; renderAll();
    showToast(S.lang==='en'?'Configuration reset.':'已重置配置。');
    return;
  }
  if(e.target.closest && (t=e.target.closest('#btnAdmin'))){ openSheet(); return; }
  if(e.target.closest && (t=e.target.closest('#btnSheetClose'))){ closeSheet(); return; }
  if(e.target.closest && (t=e.target.closest('#btnSaveParams'))){ saveParams(); return; }
  if(e.target.closest && (t=e.target.closest('#btnResetParams'))){ restoreParams(); return; }
  if(e.target.closest && (t=e.target.closest('#scrim'))){ closeSheet(); return; }

  var chip = e.target.closest ? e.target.closest('.chip') : null;
  if(chip){
    var groupEl = chip.closest('[data-group]');
    if(!groupEl) return;
    var group = groupEl.getAttribute('data-group');
    var id = chip.getAttribute('data-id');
    if(group==='func' || group==='accessories'){
      var arr = S.sel[S.cat][group];
      var i = arr.indexOf(id);
      if(i>=0){ arr.splice(i,1); }
      else{
        arr.push(id);
        if(group==='func'){
          if(id==='rfid_single' && arr.indexOf('rfid_full')>=0) arr.splice(arr.indexOf('rfid_full'),1);
          if(id==='rfid_full' && arr.indexOf('rfid_single')>=0) arr.splice(arr.indexOf('rfid_single'),1);
          if(id==='elastic6' && arr.indexOf('elastic8')>=0) arr.splice(arr.indexOf('elastic8'),1);
          if(id==='elastic8' && arr.indexOf('elastic6')>=0) arr.splice(arr.indexOf('elastic6'),1);
        }
      }
    }else{
      S.sel[S.cat][group] = id;
    }
    if(S.cat==='cardslab' && group==='type'){
      var type = byId(S.params.cardslab.types, id);
      var finId = S.sel.cardslab.finish;
      var exists = S.params.cardslab.finish[type.group].some(function(f){ return f.id===finId; });
      if(!exists){ S.sel.cardslab.finish = type.group==='alu' ? 'anod' : 'polish'; }
      // 模具类型跟随材质组联动，避免「铝壳配塑胶模」错配
      if(type.group==='alu' && S.sel.cardslab.mold==='plastic'){ S.sel.cardslab.mold='alu'; }
      if(type.group==='plastic' && S.sel.cardslab.mold==='alu'){ S.sel.cardslab.mold='plastic'; }
    }
    renderConfig(); renderResult();
  }
});

document.addEventListener('input', function(e){
  if(e.target && e.target.id==='qtyInput'){
    var v = parseInt(e.target.value, 10);
    S.qty = (!isNaN(v) && v>0) ? v : 1;
    renderResult();
  }
  if(e.target && e.target.id==='sizeInput'){ S.size = e.target.value; renderResult(); }
  if(e.target && e.target.id==='colorInput'){ S.color = e.target.value; renderResult(); }
});

/* ================= 启动 ================= */
applyLang();
showView('home');
})();
</script>
</body>
</html>
